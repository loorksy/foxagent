# Isolated FoxAgent stack. Project name MUST be foxagent.
# Publishes a single host port (default 18180) so existing Traefik/nginx apps stay untouched.
name: foxagent

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: foxagent-backend
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: ${FOXAGENT_PUBLIC_ORIGIN:-*}
      DATABASE_URL: sqlite+aiosqlite:////data/foxagent.db
      FOXAGENT_DATA_DIR: /data
      APP_PASSWORD: ${APP_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-720}
    volumes:
      - foxagent_data:/data
    networks:
      - foxagent_net
    expose:
      - "8000"

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: foxagent-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_WS_SAME_ORIGIN: "1"
    depends_on:
      - backend
    networks:
      - foxagent_net
    expose:
      - "3000"

  edge:
    image: caddy:2.8-alpine
    container_name: foxagent-edge
    restart: unless-stopped
    ports:
      - "${FOXAGENT_HOST_BIND:-0.0.0.0}:${FOXAGENT_HTTP_PORT:-18180}:18180"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - backend
    networks:
      - foxagent_net

networks:
  foxagent_net:
    name: foxagent_net
    driver: bridge

volumes:
  foxagent_data:
    name: foxagent_data
