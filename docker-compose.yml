services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foxagent
      POSTGRES_PASSWORD: foxagent
      POSTGRES_DB: foxagent
    ports:
      - "5432:5432"
    volumes:
      - fox_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  fox_pg:
